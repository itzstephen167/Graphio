<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphio</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6861; --line: #dedbd3;
    --grid-minor: #ecebe6; --grid-major: #d3d0c7; --axis: #3a3834; --paper: #ffffff;
    --accent: #2563eb; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1c1a; --ink: #eceae4; --muted: #9a968c; --line: #33312d;
      --grid-minor: #24231f; --grid-major: #38362f; --axis: #c9c5ba; --paper: #191816;
      --accent: #7aa2ff; --error: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 100%;
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: 0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 12.5px; }
  #rows { overflow: auto; flex: 1; min-height: 0; }
  .row { display: grid; grid-template-columns: 28px 1fr 28px; gap: 6px; align-items: center; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); background: var(--c); cursor: pointer; padding: 0; }
  .swatch[aria-pressed="false"] { background: transparent; }
  .row input[type=text] {
    width: 100%; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink);
    font: 15px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 6px 8px;
  }
  .row input[type=text]:hover { border-color: var(--line); }
  .row input[type=text]:focus { outline: none; border-color: var(--accent); }
  .del { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; border-radius: 6px; height: 28px; }
  .del:hover { color: var(--ink); background: var(--bg); }
  .meta { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 17px; padding-left: 8px; }
  .meta.err { color: var(--error); }
  footer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.btn:hover { border-color: var(--muted); }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  #total { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { position: relative; min-width: 0; min-height: 0; background: var(--paper); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; }
  .zoom button { width: 34px; height: 34px; padding: 0; font-size: 17px; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .pane[hidden] { display: none; }
  #pane-calc { overflow-y: auto; }
  #hist { flex: 1 0 84px; overflow: auto; display: flex; flex-direction: column; }
  #hist:empty::before { content: "Results appear here. Press Enter or = to evaluate."; color: var(--muted); font-size: 12.5px; padding: 14px 16px; }
  .h { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; padding: 8px 16px; cursor: pointer; font: inherit; }
  .h:hover { background: var(--bg); }
  .h .q { display: block; color: var(--muted); font: 13px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow-wrap: anywhere; }
  .h .a { display: block; text-align: right; font-size: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .entry { border-top: 1px solid var(--line); padding: 10px 12px 6px; }
  .entry input { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 16px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 8px 10px; }
  .entry input:focus { outline: none; border-color: var(--accent); }
  #calc-out { min-height: 22px; padding: 4px 2px 0; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; overflow-wrap: anywhere; }
  #calc-out.err { color: var(--error); text-align: left; }
  #calc-out button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 6px 12px 12px; }
  .keys button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; height: 38px; font: 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer; padding: 0; }
  .keys button:hover { border-color: var(--muted); }
  .keys button:active { background: var(--bg); }
  .keys button.num { background: var(--bg); font-size: 15px; font-weight: 600; }
  .keys button.eq { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
    html, body { overflow: hidden; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); overflow-y: auto; }
    header { padding: 10px 16px 6px; }
    .pane { flex: none; }
    #hist { flex: none; height: 96px; }
    .keys button { height: 34px; }
    header p { display: none; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Graphio</h1>
    <p>A worker turns each expression into screen-tolerance polylines; this thread only projects and strokes them.</p>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-graph" aria-selected="true" aria-controls="pane-graph">Graph</button>
    <button role="tab" id="tab-calc" aria-selected="false" aria-controls="pane-calc">Calculator</button>
  </nav>
  <section class="pane" id="pane-graph" role="tabpanel" aria-labelledby="tab-graph">
  <div id="rows"></div>
  <footer>
    <div class="bar">
      <button class="btn" id="add">+ Expression</button>
      <label class="chk"><input type="checkbox" id="dbg"> Show sample points</label>
      <label class="chk"><input type="checkbox" id="poi" checked> Zeros &amp; extrema</label>
    </div>
    <div id="total"></div>
  </footer>
  </section>
  <section class="pane" id="pane-calc" role="tabpanel" aria-labelledby="tab-calc" hidden>
    <div id="hist" aria-live="polite"></div>
    <div class="entry">
      <input type="text" id="calc-in" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Calculation" placeholder="2sin(pi/6) + sqrt(2)">
      <div id="calc-out"></div>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</aside>
<main>
  <canvas id="cv" aria-label="Graph"></canvas>
  <div class="zoom">
    <button class="btn" id="zin" aria-label="Zoom in">+</button>
    <button class="btn" id="zout" aria-label="Zoom out">−</button>
    <button class="btn" id="home" aria-label="Reset view">⌂</button>
  </div>
</main>

<!-- The sampling engine. It runs inside a Web Worker built from this text. -->
<script type="text/plain" id="engine-src">
'use strict';
// ---------------------------------------------------------------- parser
const FUNCS = {
  sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan,
  arcsin: Math.asin, arccos: Math.acos, arctan: Math.atan, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, ln: Math.log, log: Math.log10, exp: Math.exp,
  floor: Math.floor, ceil: Math.ceil, round: Math.round, sign: Math.sign,
  min: Math.min, max: Math.max, atan2: Math.atan2, mod: (a, b) => a - b * Math.floor(a / b),
};
const ARITY = { min: 2, max: 2, atan2: 2, mod: 2 };
const CONSTS = { pi: Math.PI, tau: 2 * Math.PI, e: Math.E, ans: 0 };   // ans = last calculator result
const NAMES = Object.keys(FUNCS).concat(Object.keys(CONSTS), ['x', 'y', 't']).sort((a, b) => b.length - a.length);

function tokenize(src) {
  const out = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === ' ' || c === '\t') { i++; continue; }
    if ((c >= '0' && c <= '9') || c === '.') {
      const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(src.slice(i));
      if (!m) throw new Error('Bad number at "' + src.slice(i, i + 6) + '"');
      out.push({ k: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
    }
    if (/[a-zA-Z]/.test(c)) {
      const rest = src.slice(i).toLowerCase();
      const name = NAMES.find(n => rest.startsWith(n));
      if (!name) throw new Error('Unknown symbol "' + c + '"');
      out.push({ k: 'name', v: name }); i += name.length; continue;
    }
    if ('+-*/^(),'.includes(c)) { out.push({ k: c }); i++; continue; }
    if (c === '−') { out.push({ k: '-' }); i++; continue; }
    throw new Error('Unexpected "' + c + '"');
  }
  return out;
}

// Compiles text to a closure f(x, y, t). `used` collects which variables appear.
function compileExpr(src, used) {
  const tk = tokenize(src); let p = 0;
  const peek = () => tk[p], eat = k => { if (!tk[p] || tk[p].k !== k) throw new Error('Expected "' + k + '"'); p++; };
  function expr() {
    let a = term();
    while (peek() && (peek().k === '+' || peek().k === '-')) {
      const op = tk[p++].k, l = a, r = term();
      a = op === '+' ? (x, y, t) => l(x, y, t) + r(x, y, t) : (x, y, t) => l(x, y, t) - r(x, y, t);
    }
    return a;
  }
  function term() {
    let a = unary();
    for (;;) {
      const n = peek(); if (!n) break;
      if (n.k === '*' || n.k === '/') {
        p++; const l = a, r = unary();
        a = n.k === '*' ? (x, y, t) => l(x, y, t) * r(x, y, t) : (x, y, t) => l(x, y, t) / r(x, y, t);
      } else if (n.k === 'num' || n.k === 'name' || n.k === '(') {   // implicit multiplication: 2x, x(x+1)
        const l = a, r = power(); a = (x, y, t) => l(x, y, t) * r(x, y, t);
      } else break;
    }
    return a;
  }
  function unary() {
    if (peek() && peek().k === '-') { p++; const a = unary(); return (x, y, t) => -a(x, y, t); }
    if (peek() && peek().k === '+') { p++; return unary(); }
    return power();
  }
  function power() {
    const b = primary();
    if (peek() && peek().k === '^') { p++; const e = unary(); return (x, y, t) => Math.pow(b(x, y, t), e(x, y, t)); }
    return b;
  }
  function primary() {
    const n = peek(); if (!n) throw new Error('Unexpected end');
    if (n.k === 'num') { p++; const v = n.v; return () => v; }
    if (n.k === '(') { p++; const a = expr(); eat(')'); return a; }
    if (n.k === 'name') {
      p++; const v = n.v;
      if (v === 'x') { used.add('x'); return (x) => x; }
      if (v === 'y') { used.add('y'); return (x, y) => y; }
      if (v === 't') { used.add('t'); return (x, y, t) => t; }
      if (v in CONSTS) { const c = CONSTS[v]; return () => c; }
      const fn = FUNCS[v];
      if (ARITY[v] === 2) {
        eat('('); const a = expr(); eat(','); const b = expr(); eat(')');
        return (x, y, t) => fn(a(x, y, t), b(x, y, t));
      }
      let a;
      if (peek() && peek().k === '(') { p++; a = expr(); eat(')'); } else a = unary();
      return (x, y, t) => fn(a(x, y, t));
    }
    throw new Error('Unexpected "' + n.k + '"');
  }
  const f = expr();
  if (p < tk.length) throw new Error('Unexpected "' + (tk[p].v ?? tk[p].k) + '"');
  return f;
}

// Decides what kind of curve a line of input describes.
function analyze(src) {
  const s = src.trim();
  if (!s) return null;
  if (/[<>]/.test(s)) throw new Error('Inequalities are not supported');
  if (s[0] === '(' && s[s.length - 1] === ')') {
    let depth = 0, comma = -1, closesAtEnd = true;
    for (let i = 0; i < s.length; i++) {
      if (s[i] === '(') depth++;
      else if (s[i] === ')') { depth--; if (depth === 0 && i < s.length - 1) closesAtEnd = false; }
      else if (s[i] === ',' && depth === 1 && comma < 0) comma = i;
    }
    if (closesAtEnd && comma > 0) {
      const used = new Set();
      const fx = compileExpr(s.slice(1, comma), used), fy = compileExpr(s.slice(comma + 1, -1), used);
      if (used.has('x') || used.has('y')) throw new Error('Parametric curves use t only');
      return { kind: 'parametric', fx: t => fx(0, 0, t), fy: t => fy(0, 0, t) };
    }
  }
  const parts = s.split('=');
  if (parts.length > 2) throw new Error('Only one "=" is allowed');
  if (parts.length === 1) {
    const used = new Set(), f = compileExpr(s, used);
    if (used.has('y') || used.has('t')) throw new Error('Write an equation, e.g. y = ' + s);
    return { kind: 'explicit', axis: 'x', f: x => f(x, 0, 0) };
  }
  const lu = new Set(), ru = new Set();
  const L = compileExpr(parts[0], lu), R = compileExpr(parts[1], ru);
  if (lu.has('t') || ru.has('t')) throw new Error('t is only for parametric curves: (x(t), y(t))');
  const lhs = parts[0].trim().toLowerCase(), rhs = parts[1].trim().toLowerCase();
  if (lhs === 'y' && !ru.has('y')) return { kind: 'explicit', axis: 'x', f: x => R(x, 0, 0) };
  if (rhs === 'y' && !lu.has('y')) return { kind: 'explicit', axis: 'x', f: x => L(x, 0, 0) };
  if (lhs === 'x' && !ru.has('x')) return { kind: 'explicit', axis: 'y', f: y => R(0, y, 0) };
  if (rhs === 'x' && !lu.has('x')) return { kind: 'explicit', axis: 'y', f: y => L(0, y, 0) };
  return { kind: 'implicit', F: (x, y) => L(x, y, 0) - R(x, y, 0) };
}

// ---------------------------------------------------------------- polyline builder
// Collects points and drops the ones that sit within `tol` pixels of the line
// through their neighbours, so straight stretches cost two points.
const CLAMP = 1e7;
const clampPx = v => (v > CLAMP ? CLAMP : v < -CLAMP ? -CLAMP : v);
class Polylines {
  constructor(tol) { this.tol = tol; this.out = []; this.cur = []; this.pend = []; this.ax = 0; this.ay = 0; this.open = false; }
  add(mx, my, px, py) {
    px = clampPx(px); py = clampPx(py);
    if (!this.open) { this.cur.push(mx, my); this.ax = px; this.ay = py; this.open = true; return; }
    const pend = this.pend, dx = px - this.ax, dy = py - this.ay, len = Math.hypot(dx, dy);
    let ok = pend.length < 2048;
    for (let i = 0; ok && i < pend.length; i += 4) {
      const qx = pend[i + 2] - this.ax, qy = pend[i + 3] - this.ay;
      if (len === 0) { ok = Math.hypot(qx, qy) <= this.tol; continue; }
      const along = (qx * dx + qy * dy) / (len * len);
      ok = along >= 0 && along <= 1 && Math.abs(qx * dy - qy * dx) / len <= this.tol;
    }
    if (!ok) this.commit();
    pend.push(mx, my, px, py);
  }
  commit() {
    const n = this.pend.length; if (!n) return;
    this.cur.push(this.pend[n - 4], this.pend[n - 3]); this.ax = this.pend[n - 2]; this.ay = this.pend[n - 1];
    this.pend.length = 0;
  }
  brk() {
    this.commit();
    if (this.cur.length >= 4) this.out.push(new Float64Array(this.cur));
    this.cur = []; this.open = false;
  }
}

// ---------------------------------------------------------------- v = f(u)
// u runs along `wPx` pixels; toPx maps v to a pixel offset on an axis `hPx` long.
function sampleExplicit(f, umin, umax, wPx, toPx, hPx) {
  const tol = 0.25, fin = Number.isFinite;
  const n = Math.max(5, Math.ceil(wPx / tol) + 1);
  const acc = new Polylines(tol), zeros = [], extrema = [];
  const pu = u => (u - umin) / (umax - umin) * wPx, P = v => clampPx(toPx(v));
  const put = (u, v) => acc.add(u, v, pu(u), P(v));

  // a is defined, b is not: walk a toward b to the last defined value.
  const edge = (a, b) => { for (let i = 0; i < 50; i++) { const m = (a + b) / 2; if (m === a || m === b) break; if (fin(f(m))) a = m; else b = m; } return a; };
  // Chase the half with the bigger pixel change. A smooth curve flattens out; a jump never does.
  const findJump = (a, fa, b, fb) => {
    for (let i = 0; i < 60; i++) {
      if (Math.abs(P(fb) - P(fa)) <= 0.5) return null;
      const m = (a + b) / 2; if (m === a || m === b) break;
      const fm = f(m); if (!fin(fm)) return [edge(a, m), edge(b, m)];
      if (Math.abs(P(fm) - P(fa)) >= Math.abs(P(fb) - P(fm))) { b = m; fb = fm; } else { a = m; fa = fm; }
    }
    return Math.abs(P(fb) - P(fa)) > 0.5 ? [a, b] : null;
  };
  const root = (a, fa, b) => { for (let i = 0; i < 60; i++) { const m = (a + b) / 2; if (m === a || m === b) break; const fm = f(m); if ((fm > 0) === (fa > 0)) { a = m; fa = fm; } else b = m; } return (a + b) / 2; };
  const peak = (a, b, s) => { const g = (Math.sqrt(5) - 1) / 2; let c = b - g * (b - a), d = a + g * (b - a), fc = s * f(c), fd = s * f(d);
    for (let i = 0; i < 60 && b - a > 1e-13 * (1 + Math.abs(a)); i++) { if (fc > fd) { b = d; d = c; fd = fc; c = b - g * (b - a); fc = s * f(c); } else { a = c; c = d; fc = fd; d = a + g * (b - a); fd = s * f(d); } }
    return (a + b) / 2; };

  let u0 = umin, v0 = f(u0), had = fin(v0), ua = 0, va = 0, win = false;
  if (had) put(u0, v0);
  for (let k = 1; k < n; k++) {
    const u1 = umin + (umax - umin) * (k / (n - 1)), v1 = f(u1), has = fin(v1);
    if (had && has) {
      const pa = P(v0), pb = P(v1), um = (u0 + u1) / 2, vm = f(um);
      let jump = null;
      if (!fin(vm)) jump = [edge(u0, um), edge(u1, um)];
      else {
        const pm = P(vm), off = (pa < 0 && pb < 0 && pm < 0) || (pa > hPx && pb > hPx && pm > hPx);
        if (!off && Math.abs(pm - (pa + pb) / 2) > tol) jump = findJump(u0, v0, u1, v1);
      }
      if (jump) {
        const [l, r] = jump; put(l, f(l)); acc.brk(); put(r, f(r)); if (r < u1) put(u1, v1); win = false;
      } else {
        if ((v0 < 0 && v1 > 0) || (v0 > 0 && v1 < 0)) { if (zeros.length < 800) zeros.push(root(u0, v0, u1), 0); }
        else if (v1 === 0 && v0 !== 0 && zeros.length < 800) zeros.push(u1, 0);
        if (win) {
          const up = v0 > va && v0 > v1, down = v0 < va && v0 < v1;
          if ((up || down) && Math.abs(P(v0) - P(va)) > 1e-7 && Math.abs(P(v0) - P(v1)) > 1e-7 && extrema.length < 800) {
            const ue = peak(ua, u1, up ? 1 : -1); extrema.push(ue, f(ue));
          }
        }
        put(u1, v1); ua = u0; va = v0; win = true;
      }
    } else if (had && !has) {
      const e = edge(u0, u1); if (e !== u0) put(e, f(e)); acc.brk(); win = false;
    } else if (!had && has) {
      const e = edge(u1, u0); if (e !== u1) put(e, f(e)); put(u1, v1); win = false;
    }
    u0 = u1; v0 = v1; had = has;
  }
  acc.brk();
  return { polylines: acc.out, zeros, extrema };
}

// ---------------------------------------------------------------- (x(t), y(t))
function sampleParametric(fx, fy, t0, t1, toPx, W, H) {
  const tol = 0.25, acc = new Polylines(tol), fin = Number.isFinite;
  const pt = t => { const x = fx(t), y = fy(t), ok = fin(x) && fin(y), q = ok ? toPx(x, y) : [0, 0]; return { t, x, y, px: q[0], py: q[1], ok }; };
  const put = p => acc.add(p.x, p.y, p.px, p.py);
  const sameSideOff = (a, m, b) => (a.px < 0 && m.px < 0 && b.px < 0) || (a.px > W && m.px > W && b.px > W) || (a.py < 0 && m.py < 0 && b.py < 0) || (a.py > H && m.py > H && b.py > H);
  // `a` has already been emitted (or is undefined); emits everything up to and including `b`.
  function refine(a, b, depth) {
    if (!a.ok && !b.ok) return;
